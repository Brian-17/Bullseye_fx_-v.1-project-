<main class="flex min-h-svh w-full justify-center p-6 md:p-10 items-start">
	<div class="w-full max-w-md">
		<app-auth-form
			title="Forgot Password"
			description="Enter your username and we'll send you a reset link"
			[error]="submitError()"
			[success]="
				success()
					? 'If that username exists in our system, you will receive a reset link shortly.'
					: null
			"
			submitText="Send Reset Link"
			submitLoadingText="Sending…"
			[submitting]="submitting()"
			[submitDisabled]="success()"
			[footer]="{ text: 'Remember your password?', link: routes.LOGIN.PATH, linkText: 'Sign in' }"
			(submitted)="onSubmit()"
		>
			<div class="mt-4 flex flex-col gap-4">
				<app-field
					label="Username"
					htmlFor="forgot-username"
					[error]="controlError('username', 'email')"
				>
					<app-input
						[value]="form.controls.username.value ?? ''"
						(valueChange)="setControl('username', $event)"
						[placeholder]="placeholders.USERNAME"
						[disabled]="success()"
					/>
				</app-field>
			</div>
		</app-auth-form>
	</div>
</main>
