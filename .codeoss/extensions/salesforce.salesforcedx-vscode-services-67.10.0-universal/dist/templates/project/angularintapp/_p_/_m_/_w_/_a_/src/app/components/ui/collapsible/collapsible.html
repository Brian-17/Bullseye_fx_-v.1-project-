<mat-expansion-panel [expanded]="open()" (expandedChange)="open.set($event)">
	<mat-expansion-panel-header>
		@if (title()) {
			<mat-panel-title>{{ title() }}</mat-panel-title>
		} @else {
			<ng-content select="[collapsibleHeader]" />
		}
	</mat-expansion-panel-header>
	<ng-content />
</mat-expansion-panel>
