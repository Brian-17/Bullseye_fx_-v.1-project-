<mat-form-field
	class="w-full"
	[class]="'size-' + size()"
	[appearance]="appearance()"
	subscriptSizing="dynamic"
>
	@if (label()) {
		<mat-label>{{ label() }}</mat-label>
	}
	<input
		matInput
		[type]="type()"
		[placeholder]="placeholder()"
		[disabled]="disabled()"
		[attr.id]="id() || null"
		[attr.aria-describedby]="ariaDescribedby() || null"
		[(ngModel)]="value"
	/>
</mat-form-field>
