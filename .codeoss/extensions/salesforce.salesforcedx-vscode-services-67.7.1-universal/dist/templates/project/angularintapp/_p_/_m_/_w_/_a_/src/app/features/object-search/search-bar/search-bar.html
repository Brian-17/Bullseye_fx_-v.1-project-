<div class="flex items-center gap-2 w-full">
	<div class="relative flex-1">
		<svg
			xmlns="http://www.w3.org/2000/svg"
			class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground pointer-events-none z-10"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
			aria-hidden="true"
		>
			<circle cx="11" cy="11" r="8" />
			<path d="m21 21-4.3-4.3" />
		</svg>
		<app-input
			class="pl-9 block"
			type="text"
			[placeholder]="searchConfig().placeholder ?? ''"
			[label]="searchConfig().label"
			[(value)]="term"
		/>
	</div>
	<app-popover [(open)]="popoverOpen" align="end">
		<app-button
			trigger
			appearance="outlined"
			[attr.aria-expanded]="popoverOpen()"
			aria-label="Toggle filters"
			class="gap-2"
		>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				class="h-4 w-4"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<path d="M3 6h18M7 12h10M10 18h4" />
			</svg>
			<span>Filters</span>
			@if (nonSearchFilterCount() > 0) {
			<span
				class="inline-flex items-center justify-center h-5 min-w-5 rounded-full bg-primary text-primary-foreground text-xs px-1"
			>
				{{ nonSearchFilterCount() }}
			</span>
			}
		</app-button>
		<div class="p-3 min-w-72 max-w-96 space-y-3">
			<ng-content select="[filters]" />
		</div>
	</app-popover>
</div>
