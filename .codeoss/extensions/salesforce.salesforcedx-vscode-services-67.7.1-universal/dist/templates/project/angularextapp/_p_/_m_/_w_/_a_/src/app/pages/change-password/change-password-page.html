<main class="flex min-h-svh w-full justify-center p-6 md:p-10 items-start">
	<div class="w-full max-w-md">
		<app-auth-form
			title="Change Password"
			description="Enter your current and new password below"
			[showAlreadyLoggedIn]="false"
			[error]="submitError()"
			[success]="
				success()
					? 'Password changed successfully! Use the link below to return to your profile.'
					: null
			"
			submitText="Change Password"
			submitLoadingText="Changing…"
			[submitting]="submitting()"
			[submitDisabled]="success()"
			[footer]="{ link: routes.PROFILE.PATH, linkText: 'Back to Profile' }"
			(submitted)="onSubmit()"
		>
			<div class="mt-4 flex flex-col gap-4">
				<app-field
					label="Current Password"
					htmlFor="change-current-password"
					[error]="controlError('currentPassword', 'required')"
				>
					<app-input
						type="password"
						[value]="form.controls.currentPassword.value ?? ''"
						(valueChange)="setControl('currentPassword', $event)"
						[placeholder]="placeholders.PASSWORD"
						[disabled]="success()"
					/>
				</app-field>

				<app-field
					label="New Password"
					htmlFor="change-new-password"
					[error]="controlError('newPassword', 'password')"
				>
					<app-input
						type="password"
						[value]="form.controls.newPassword.value ?? ''"
						(valueChange)="setControl('newPassword', $event)"
						[placeholder]="placeholders.PASSWORD_NEW"
						[disabled]="success()"
					/>
				</app-field>

				<app-field
					label="Confirm Password"
					htmlFor="change-confirm-password"
					[error]="
						controlError('confirmPassword', 'passwordMismatch') ??
						controlError('confirmPassword', 'required')
					"
				>
					<app-input
						type="password"
						[value]="form.controls.confirmPassword.value ?? ''"
						(valueChange)="setControl('confirmPassword', $event)"
						[placeholder]="placeholders.PASSWORD_NEW_CONFIRM"
						[disabled]="success()"
					/>
				</app-field>
			</div>
		</app-auth-form>
	</div>
</main>
