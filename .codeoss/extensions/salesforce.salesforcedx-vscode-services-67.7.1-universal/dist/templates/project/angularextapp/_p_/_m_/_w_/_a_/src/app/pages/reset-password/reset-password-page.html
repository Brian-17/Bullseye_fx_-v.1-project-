<main class="flex min-h-svh w-full justify-center p-6 md:p-10 items-start">
	<div class="w-full max-w-md">
		@if (!token) {
		<app-card-layout title="Reset Password">
			<app-status-alert variant="error">
				Reset token is invalid or expired.
				<a [routerLink]="routes.FORGOT_PASSWORD.PATH" class="underline underline-offset-4">
					Request a new password reset link.
				</a>
			</app-status-alert>
		</app-card-layout>
		} @else {
		<app-auth-form
			title="Reset Password"
			description="Enter your new password below"
			[error]="submitError()"
			[success]="success() ? 'Password reset successfully! Use the link below to sign in.' : null"
			submitText="Reset Password"
			submitLoadingText="Resetting…"
			[submitting]="submitting()"
			[submitDisabled]="success()"
			[footer]="{ text: 'Remember your password?', link: routes.LOGIN.PATH, linkText: 'Sign in' }"
			(submitted)="onSubmit()"
		>
			<div class="mt-4 flex flex-col gap-4">
				<app-field
					label="New Password"
					htmlFor="reset-new-password"
					[error]="controlError('newPassword', 'password')"
				>
					<app-input
						type="password"
						[value]="form.controls.newPassword.value ?? ''"
						(valueChange)="setControl('newPassword', $event)"
						[placeholder]="placeholders.PASSWORD_NEW"
						[disabled]="success()"
					/>
				</app-field>

				<app-field
					label="Confirm Password"
					htmlFor="reset-confirm-password"
					[error]="
							controlError('confirmPassword', 'passwordMismatch') ??
							controlError('confirmPassword', 'required')
						"
				>
					<app-input
						type="password"
						[value]="form.controls.confirmPassword.value ?? ''"
						(valueChange)="setControl('confirmPassword', $event)"
						[placeholder]="placeholders.PASSWORD_NEW_CONFIRM"
						[disabled]="success()"
					/>
				</app-field>
			</div>
		</app-auth-form>
		}
	</div>
</main>
